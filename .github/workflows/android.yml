# Builds the Android app (a wrapper that opens the hosted site) and attaches the APK to a GitHub Release.
# Runs when anything under mobile/ changes, or manually from the Actions tab.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      # Signed with the permanent release key (repository secrets), so each build installs over the last.
      # EcoCredx.apk is for direct download; EcoCredx.aab is the format Google Play asks for.
      - name: Build signed APK and Play Store bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ecocredx-release.jks
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/EcoCredx.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/EcoCredx.aab"
          rm "$ANDROID_KEYSTORE_FILE"
      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v1.0.${{ github.run_number }}" EcoCredx.apk EcoCredx.aab \
            --title "EcoCredx Android app 1.0.${{ github.run_number }}" \
            --notes "Install on Android: download EcoCredx.apk, open it, and allow installing from this source. The app opens the live EcoCredx site, so it always shows the latest version."
